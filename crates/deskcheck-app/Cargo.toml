[package]
name = "deskcheck-app"
description = "DeskCheck: the window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_1"] }
async-channel = "2.5.0"
deskcheck-config.workspace = true
deskcheck-core.workspace = true
deskcheck-mutter.workspace = true
deskcheck-network.workspace = true
deskcheck-pulse.workspace = true
gdk4-x11 = "0.10.3"
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_6"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
x11rb = "0.14.0"

[build-dependencies]
glib-build-tools = "0.21.0"

[lints]
workspace = true
