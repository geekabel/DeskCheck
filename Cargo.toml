[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 needs Rust 1.85. Keep in sync with the `msrv` job in CI.
rust-version = "1.85"
authors = ["Godwin <koffigodwin96@gmail.com>"]
license = "MIT"
repository = "https://github.com/geekabel/DeskCheck"
publish = false

[workspace.dependencies]
deskcheck-core = { path = "crates/deskcheck-core" }
deskcheck-pulse = { path = "crates/deskcheck-pulse" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
