name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests (Ubuntu 22.04)
    # The ubuntu-22.04 runner image is deprecated, so we run the job in an
    # ubuntu:22.04 container. The libraries then match the real target.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v6
      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal \
                --default-toolchain stable -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        # Each clippy message also becomes an annotation, so failures are
        # visible on the commit and through the GitHub API.
        shell: bash
        run: |
          echo "::notice::$(cargo clippy --version)"
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --locked \
              --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            grep -E '(error|warning)(\[|:)' clippy.log | head -n 20 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Tests
        run: cargo test --workspace --locked

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v6
      - name: Install Rust (1.85, same as rust-version in Cargo.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal \
                --default-toolchain 1.85
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check
        run: cargo check --workspace --all-targets --locked
